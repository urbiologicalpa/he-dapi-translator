# H&E -> DAPI quality fine-tune at 1024px.
# Initialise from the corrected forward 1024 checkpoint; add colour/contrast +
# gradient losses and run longer than the 1k-step first baseline.
data:
  name: hemit
  root: data/raw/hemit
  processed: data/processed/hemit_train_1024.h5
  patch_size: 1024
  split: [3717, 630, 945]
  stain_norm: none
  augment: false
  lowram_subset: null
  direction: he2dapi

model:
  name: pix2pix_unet
  generator:
    arch: unet
    ngf: 64
  discriminator:
    arch: patchgan
    ndf: 64
    n_layers: 3
  loss:
    gan_weight: 3.0
    l1_weight: 50.0
    ssim_weight: 10.0
    dists_weight: 0.0
    nuclei_aux_weight: 2.0
    color_weight: 5.0
    grad_weight: 2.0

training:
  epochs: 4
  batch_size: 1
  grad_accum: 8
  num_workers: 2
  lr: 0.00003
  beta1: 0.5
  mixed_precision: false
  precision: fp32
  dists_on_cpu: false
  checkpoint_dir: resources/models/checkpoints/he2dapi_quality_1024
  save_every: 1
  resume: auto
  export_onnx: false
  oom_guard: true
  max_cache_mb: 16

experiment:
  tracker: none
  project: he-dapi-translator
