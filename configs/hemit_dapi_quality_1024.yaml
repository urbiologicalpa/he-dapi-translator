# H&E -> DAPI (ch2) long 1024px fine-tune, 2026-10-24 (Stage 2.5b).
# Seeded from the legacy 512px epoch-200 checkpoint (best forward DAPI model),
# NOT from the undertrained 1024 baseline. Paper-aligned LR (3e-5), long
# schedule, val-based best-checkpoint selection.
#
# Colour/gradient losses are OFF: the 2026-10-22 forward quality pass with
# color_weight=5 / grad_weight=2 degraded every metric (FID 77.14 -> 89.32 at
# 512px). Keep nuclei Dice because the target is DAPI (nuclei).
data:
  name: hemit
  root: data/raw/hemit
  processed: data/processed/hemit_train_1024.h5
  patch_size: 1024
  split: [3717, 630, 945]
  stain_norm: none
  augment: false
  lowram_subset: null
  direction: he2dapi

model:
  name: pix2pix_unet
  generator:
    arch: unet
    ngf: 64
  discriminator:
    arch: patchgan
    ndf: 64
    n_layers: 3
  loss:
    gan_weight: 1.0
    l1_weight: 50.0
    ssim_weight: 10.0
    dists_weight: 0.0
    nuclei_aux_weight: 2.0
    color_weight: 0.0
    grad_weight: 0.0

training:
  epochs: 20
  batch_size: 1
  grad_accum: 8
  num_workers: 2
  lr: 0.00003
  beta1: 0.5
  mixed_precision: false
  precision: fp32
  dists_on_cpu: false
  checkpoint_dir: resources/models/checkpoints/he2dapi_quality_1024
  save_every: 1
  resume: auto
  export_onnx: false
  oom_guard: true
  max_cache_mb: 16
  # Fixed 50-crop val subset for best-checkpoint selection. Score is
  # L1 + 0.25*(1 - SSIM_skimage); lower is better.
  val_h5: data/processed/hemit_val_1024.h5
  val_num: 50
  val_every: 1

experiment:
  tracker: none
  project: he-dapi-translator
