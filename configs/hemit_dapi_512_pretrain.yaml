# Corrected H&E -> DAPI (ch2, blue) pretraining at 512px.
# Uses the 1024px Macenko HDF5 and center-crops to 512.
data:
  name: hemit
  root: data/raw/hemit
  processed: data/processed/hemit_train_1024.h5
  patch_size: 512
  split: [3717, 630, 945]
  stain_norm: none
  augment: false
  lowram_subset: null

model:
  name: pix2pix_unet
  generator:
    arch: unet
    ngf: 64
  discriminator:
    arch: patchgan
    ndf: 64
    n_layers: 3
  loss:
    gan_weight: 1.0
    l1_weight: 100.0
    ssim_weight: 10.0
    dists_weight: 0.0
    nuclei_aux_weight: 0.0

training:
  epochs: 20
  batch_size: 4
  grad_accum: 2
  num_workers: 2
  lr: 0.0002
  beta1: 0.5
  mixed_precision: false
  precision: fp32
  dists_on_cpu: false
  checkpoint_dir: resources/models/checkpoints/he2dapi_dapi_512
  save_every: 1
  resume: auto
  export_onnx: false
  oom_guard: true
  max_cache_mb: 16

experiment:
  tracker: none
  project: he-dapi-translator
