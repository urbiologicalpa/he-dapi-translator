# DAPI -> H&E quality fine-tune at 1024px.
# Initialise from the paired reverse checkpoint; add colour/contrast + gradient
# losses and run longer than the first 2x500-step baseline.
data:
  name: hemit
  root: data/raw/hemit
  processed: data/processed/hemit_train_1024.h5
  patch_size: 1024
  split: [3717, 630, 945]
  stain_norm: none
  augment: false
  lowram_subset: null
  direction: dapi2he

model:
  name: pix2pix_unet
  generator:
    arch: unet
    ngf: 64
  discriminator:
    arch: patchgan
    ndf: 64
    n_layers: 3
  loss:
    gan_weight: 3.0
    l1_weight: 50.0
    ssim_weight: 10.0
    # DISTS stays off: VGG weights may be unavailable offline on Kaggle.
    # SSIM + colour + gradient cover structure, stain colour and sharpness.
    dists_weight: 0.0
    nuclei_aux_weight: 0.0
    color_weight: 20.0
    grad_weight: 25.0

training:
  epochs: 4
  batch_size: 1
  grad_accum: 8
  num_workers: 2
  lr: 0.00003
  beta1: 0.5
  mixed_precision: false
  precision: fp32
  dists_on_cpu: false
  checkpoint_dir: resources/models/checkpoints/dapi2he_quality_1024
  save_every: 1
  resume: auto
  export_onnx: false
  oom_guard: true
  max_cache_mb: 16
  # Stage 2.5: fixed val subset -> checkpoint_best.pt / generator_best.pt.
  val_h5: data/processed/hemit_val_1024.h5
  val_num: 50
  val_every: 1

experiment:
  tracker: none
  project: he-dapi-translator
