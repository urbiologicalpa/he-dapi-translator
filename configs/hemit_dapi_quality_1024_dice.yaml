# H&E -> DAPI (ch2) Dice-preserving 1024px probe, 2026-10-26.
# Seeded from the legacy 512px epoch-200 checkpoint (Dice 0.4315 at 1024).
#
# Why this run: Stage 2.5b fine-tuning improved L1/SSIM/LPIPS but dropped
# nuclei Dice 0.4315 -> 0.2018. Root cause: NucleiDiceLoss used a hard
# threshold, so its gradient was zero almost everywhere and
# nuclei_aux_weight=2.0 could not preserve nuclei. This config uses the fixed
# soft-threshold Dice loss with weight 10.
#
# Quota probe: 4 epochs (~2.3h on T4) fits the remaining weekly GPU quota
# (2.68h). If Dice improves, run the full schedule after the 2026-10-31 reset.
data:
  name: hemit
  root: data/raw/hemit
  processed: data/processed/hemit_train_1024.h5
  patch_size: 1024
  split: [3717, 630, 945]
  stain_norm: none
  augment: false
  lowram_subset: null
  direction: he2dapi

model:
  name: pix2pix_unet
  generator:
    arch: unet
    ngf: 64
  discriminator:
    arch: patchgan
    ndf: 64
    n_layers: 3
  loss:
    gan_weight: 1.0
    l1_weight: 50.0
    ssim_weight: 10.0
    dists_weight: 0.0
    nuclei_aux_weight: 10.0
    nuclei_thresh: 0.1
    nuclei_temp: 0.05
    color_weight: 0.0
    grad_weight: 0.0

training:
  epochs: 4
  batch_size: 1
  grad_accum: 8
  num_workers: 2
  lr: 0.00005
  beta1: 0.5
  mixed_precision: false
  precision: fp32
  dists_on_cpu: false
  checkpoint_dir: resources/models/checkpoints/he2dapi_quality_1024_dice
  save_every: 1
  resume: auto
  export_onnx: false
  oom_guard: true
  max_cache_mb: 16
  # Fixed 50-crop val subset for best-checkpoint selection. Score is
  # L1 + 0.25*(1 - SSIM_skimage); lower is better.
  val_h5: data/processed/hemit_val_1024.h5
  val_num: 50
  val_every: 1

experiment:
  tracker: none
  project: he-dapi-translator
