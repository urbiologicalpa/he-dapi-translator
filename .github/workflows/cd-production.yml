name: cd-production

# Stage 3 — PRODUCTION: tag push v*.*.* promotes the SAME SHA image
# (:staging -> :<version> + :latest) and attaches ONNX + metrics to the GitHub
# Release. Requires `production` environment approval (required reviewers).
# Rollback = re-tag previous v* (immutable SHAs, never overwrite :latest by hand).
# NOTE (2026-10-18): trigger is tag-push ONLY — adding `release: published` too
# caused duplicate runs, and `fetch-tags: true` broke checkout on release events
# ("Cannot fetch both <sha> and refs/tags/vX"). Checkout now pins `ref: tag`.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production # branch policy = main/tags only + required reviewers
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote staging SHA -> version + latest (no rebuild)
        run: |
          SHA="${GITHUB_SHA}"
          REPO_LC="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          VER="${GITHUB_REF_NAME}"
          echo "Promoting ghcr.io/${REPO_LC}:${SHA} -> :${VER} + :latest"
          docker pull "ghcr.io/${REPO_LC}:${SHA}" || docker pull "ghcr.io/${REPO_LC}:staging"
          SRC="$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -E "${REPO_LC}:(staging|${SHA})" | head -n 1)"
          echo "Source: ${SRC}"
          docker tag "${SRC}" "ghcr.io/${REPO_LC}:${VER}"
          docker tag "${SRC}" "ghcr.io/${REPO_LC}:latest"
          docker push "ghcr.io/${REPO_LC}:${VER}"
          docker push "ghcr.io/${REPO_LC}:latest"
      - name: Post-deploy health poll (GHCR manifest exists)
        run: |
          echo "Post-deploy: verify tags exist, then run hosted /health against prod URL."
          echo "Prod URL placeholder: set PROD_URL repo variable (HF Space or VM) to enable live poll."
      - name: Attach release artifacts (status docs; corrected weights added later)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: false
          # Do NOT attach docs/metrics_eval.json or *.onnx until they belong to a
          # corrected H&E -> DAPI model. Current artifacts are the panCK ablation.
          files: |
            docs/RESULTS.md
            docs/MODEL_CARD.md
