name: guards

# Stage 0 — CI: fast low-RAM guards on every push/PR (no torch, no GPU).
# Staging/production deploys live in cd-staging.yml / cd-production.yml.
on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resource-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install light deps (no torch — guards are static + numpy checks)
        run: pip install numpy pillow pyyaml psutil tifffile zarr h5py pytest
      - name: Secret scan (block tokens/keys from public repo)
        run: |
          echo "Scanning tracked text files for leaked secrets..."
          if git grep -n -E "ghp_[A-Za-z0-9]{10,}|gho_[A-Za-z0-9]{10,}|hf_[A-Za-z0-9]{10,}|KGAT_[A-Za-z0-9]{10,}|AKIA[0-9A-Z]{16}|xox[bap]-[A-Za-z0-9-]+" -- . ':!*.pt' ':!*.h5' ':!*.hdf5' ':!*.ckpt' | grep -v "KGAT_\.\.\." ; then
            echo "::error::Possible secret in tracked files — remove it, use env vars (HF_TOKEN, KAGGLE_API_TOKEN, GITHUB_TOKEN) instead."
            exit 1
          fi
          echo "SECRET_SCAN_OK (redacted KGAT_... placeholders allowed)"
      - name: Low-RAM config enforcement
        run: PYTHONPATH=. python -m src.utils.progress_tracker --enforce
      - name: Resource-guard regression tests
        run: PYTHONPATH=. python -m pytest tests/test_resource_guards.py -v
      - name: Dataset fallback regression tests
        run: PYTHONPATH=. python -m pytest tests/test_datasets.py -v
      - name: Backend smoke (import + /health, no model weights needed)
        run: |
          pip install fastapi httpx python-multipart
          PYTHONPATH=. python -c "from src.backend.main import app; from fastapi.testclient import TestClient; c=TestClient(app); r=c.get('/health'); assert r.status_code==200, r.text; print('HEALTH_OK', r.json())"

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU torch + he-dapi (editable, no deps auto-resolve)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install --no-deps -e ./packages/he-dapi
          pip install numpy pillow huggingface_hub pyyaml pytest build
      - name: he-dapi + napari plugin tests
        run: pytest packages/he-dapi/tests packages/napari-he-dapi/tests -v
      - name: Build both wheels (packaging regression)
        run: |
          python -m build --wheel packages/he-dapi --outdir /tmp/dist
          python -m build --wheel packages/napari-he-dapi --outdir /tmp/dist
          ls -la /tmp/dist
