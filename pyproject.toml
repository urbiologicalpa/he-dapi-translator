[project]
name = "he-dapi-translator"
version = "0.1.0"
description = "Bidirectional H&E <-> DAPI virtual staining product scaffold (alpha; forward baseline only)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "pillow>=10.0",
    "scikit-image>=0.22",
    "tifffile>=2024.5.22",
    "h5py>=3.8",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "zarr>=2.16",
    "albumentations>=1.3",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]
wsi = ["large-image[openslide,tiff]", "openslide-python>=1.3"]
onnx = ["onnx>=1.16", "onnxruntime>=1.18"]
lowram = ["psutil>=5.9"]
data = ["torchstain==1.4.1", "imagecodecs"]
metrics = ["lpips>=0.1.4"]  # FID uses torchvision Inception; LPIPS is optional

[tool.uv]
managed = true

[tool.pytest.ini_options]
testpaths = ["tests", "packages/he-dapi/tests", "packages/napari-he-dapi/tests"]
# Keep the default run inside the 3.7GB box's memory budget. Training smoke
# tests are opt-in: `pytest -m slow` (the last -m wins over this default).
addopts = "-m 'not slow'"
markers = [
  "slow: long-running smoke tests (training dummy runs)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
