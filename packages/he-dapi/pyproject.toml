[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "he-dapi"
version = "0.1.1"
description = "H&E <-> DAPI virtual staining: inference library + CLI (early/alpha)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "urbiologicalpa" }]
keywords = ["histopathology", "virtual-staining", "dapi", "he", "pix2pix", "wsi", "computational-pathology"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "torch>=2.0",
  "numpy>=1.24",
  "pillow>=10.0",
  "huggingface_hub>=0.20",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.16"]
wsi = ["tifffile", "openslide-python"]
dev = ["pytest", "ruff", "build"]

[project.scripts]
he-dapi = "he_dapi.cli:main"

[project.urls]
Homepage = "https://github.com/urbiologicalpa/he-dapi-translator"
Repository = "https://github.com/urbiologicalpa/he-dapi-translator"
"Bug Tracker" = "https://github.com/urbiologicalpa/he-dapi-translator/issues"
HuggingFace = "https://huggingface.co/urbiologicalpa/he-dapi-translator"

[tool.hatch.build.targets.wheel]
packages = ["src/he_dapi"]

[tool.hatch.build.targets.sdist]
include = ["src/he_dapi", "README.md"]
